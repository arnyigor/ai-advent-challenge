name: Day 32 AI code review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: day32-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted reviewer dependency
        run: python -m pip install requests==2.32.5
      - name: Fetch PR objects without checkout
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/$PR_NUMBER/head"
      - name: Review exact event SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAY32_MODEL: ${{ vars.DAY32_MODEL || 'gemini-3.5-flash-lite' }}
        run: python day32-ai-code-review/review.py --base "$BASE_SHA" --head "$HEAD_SHA" --output review-output
      - name: Job summary
        run: cat review-output/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: review-output/
          if-no-files-found: warn
